        <div style="background: var(--white); padding: 1.5rem; border-radius: 8px; box-shadow: var(--shadow); margin-top: 2rem;">

        </div>
    </div>

    <script>
        // Sidebar toggle for mobile
        const sidebar = document.querySelector('.admin-sidebar');
        const mainContent = document.querySelector('.admin-main');

        // For mobile responsiveness, add a toggle button
        const toggleBtn = document.createElement('button');
        toggleBtn.style.display = 'none';
        toggleBtn.style.position = 'fixed';
        toggleBtn.style.top = '1rem';
        toggleBtn.style.left = '1rem';
        toggleBtn.style.zIndex = '1000';
        toggleBtn.style.background = 'var(--primary-color)';
        toggleBtn.style.color = 'var(--white)';
        toggleBtn.style.padding = '0.5rem 1rem';
        toggleBtn.style.border = 'none';
        toggleBtn.style.borderRadius = '4px';
        toggleBtn.style.cursor = 'pointer';
        toggleBtn.innerHTML = '<i class="fas fa-bars"></i>';
        document.body.insertBefore(toggleBtn, document.body.firstChild);

        toggleBtn.addEventListener('click', () => {
            sidebar.style.left = sidebar.style.left === '0px' ? '-250px' : '0px';
            mainContent.style.marginLeft = mainContent.style.marginLeft === '250px' ? '0' : '250px';
        });

        // Make sidebar draggable/responsive on mobile
        function handleResize() {
            if (window.innerWidth < 768) {
                sidebar.style.left = '-250px';
                mainContent.style.marginLeft = '0';
                toggleBtn.style.display = 'block';
            } else {
                sidebar.style.left = '0';
                mainContent.style.marginLeft = '250px';
                toggleBtn.style.display = 'none';
            }
        }
        window.addEventListener('resize', handleResize);
        handleResize();
    </script>

</body>
